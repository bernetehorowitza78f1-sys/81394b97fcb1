version: 2.1

jobs:
  inputRemap:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load bindings
          command: |
            printf 'jump=space\n' > input.cfg
      - run:
          name: Build input system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target inputRemap -j2
      - run:
          name: Remap action bindings
          command: LIONSS_LP=1 ./build/inputRemap --conf input.cfg --device gamepad
  pewter9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Assemble parts
          command: |
            printf 'parts = 9\n' > pewter.cfg
      - run:
          name: Build assembler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pewter9 -j2
      - run:
          name: Cast pewter components
          command: LIONSS_LP=1 ./build/pewter9 --config pewter.cfg --mold v9
  loudness_lufs:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load program
          command: |
            : > prog.wav
      - run:
          name: Build loudness meter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target loudness_lufs -j2
      - run:
          name: Measure integrated LUFS
          command: LIONSS_LP=1 ./build/loudness_lufs --in prog.wav --target -23
  gc_nursery:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
